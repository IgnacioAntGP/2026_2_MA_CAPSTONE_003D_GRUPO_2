<ion-content [fullscreen]="true">

  <div class="page-container">

    <header class="page-header">

      <div>

        <ion-button
          class="back-button"
          type="button"
          fill="clear"
          [routerLink]="['/detalle-consulta', idConsulta]"
        >
          ← Volver a la consulta
        </ion-button>

        <h1>
          Editar publicación
        </h1>

        <p>
          Modifica el contenido de tu consulta.
        </p>

      </div>

      <app-side-menu></app-side-menu>

    </header>


    <main
      class="page-card"
      *ngIf="consulta"
    >

      <!-- TÍTULO -->
      <div class="form-group">

        <label>
          Título
        </label>

        <ion-input
          type="text"
          fill="outline"
          [(ngModel)]="titulo"
        >
        </ion-input>

      </div>


      <!-- ASIGNATURA -->
      <div class="form-group">

        <label>
          Asignatura
        </label>

        <ion-select
          fill="outline"
          [(ngModel)]="idAsignatura"
        >

          <ion-select-option [value]="1">
            Programación
          </ion-select-option>

          <ion-select-option [value]="2">
            Bases de Datos
          </ion-select-option>

          <ion-select-option [value]="3">
            Matemáticas
          </ion-select-option>

          <ion-select-option [value]="4">
            Ingeniería de Software
          </ion-select-option>

        </ion-select>

      </div>


      <!-- DESCRIPCIÓN -->
      <div class="form-group">

        <label>
          Describe tu duda
        </label>

        <ion-textarea
          fill="outline"
          rows="7"
          [(ngModel)]="descripcion"
        >
        </ion-textarea>

      </div>


      <!-- ACCIONES -->
      <div class="form-actions">

        <ion-button
          class="secondary-button"
          type="button"
          fill="outline"
          [routerLink]="['/detalle-consulta', idConsulta]"
        >
          Cancelar
        </ion-button>

        <ion-button
          class="primary-button"
          type="button"
          (click)="guardarCambios()"
        >
          Guardar cambios
        </ion-button>

      </div>

    </main>

  </div>

</ion-content>
