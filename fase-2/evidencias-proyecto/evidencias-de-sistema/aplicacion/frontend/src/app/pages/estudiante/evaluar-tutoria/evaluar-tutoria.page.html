<ion-content [fullscreen]="true">

  <div class="page-container">

    <header class="page-header">

      <div>

        <ion-button
          class="back-button"
          type="button"
          fill="clear"
          routerLink="/evaluaciones"
        >
          ← Volver a Evaluaciones
        </ion-button>

        <h1>
          Evaluar tutoría
        </h1>

        <p>
          Comparte tu experiencia con la tutoría realizada.
        </p>

      </div>

      <app-side-menu></app-side-menu>

    </header>


    <main class="page-content">

      <!-- RESUMEN -->
      <ion-card class="tutoria-resumen">

        <ion-card-header>

          <ion-chip class="asignatura-chip">
            Programación
          </ion-chip>

          <ion-card-title>
            ¿Cómo puedo recorrer una lista en Java?
          </ion-card-title>

        </ion-card-header>

        <ion-card-content>

          <p>
            Tutor:
            <strong>Felipe</strong>
          </p>

        </ion-card-content>

      </ion-card>


      <!-- FORMULARIO -->
      <section class="page-card evaluacion-form">

        <!-- CALIFICACIÓN -->
        <div class="form-group">

          <label>
            ¿Cómo evaluarías la tutoría?
          </label>

          <div class="rating">

            <ion-button
              class="rating-button"
              type="button"
              fill="clear"
            >
              ★
            </ion-button>

            <ion-button
              class="rating-button"
              type="button"
              fill="clear"
            >
              ★
            </ion-button>

            <ion-button
              class="rating-button"
              type="button"
              fill="clear"
            >
              ★
            </ion-button>

            <ion-button
              class="rating-button"
              type="button"
              fill="clear"
            >
              ★
            </ion-button>

            <ion-button
              class="rating-button"
              type="button"
              fill="clear"
            >
              ★
            </ion-button>

          </div>

          <span class="rating-help">
            Selecciona una calificación de 1 a 5
          </span>

        </div>


        <!-- COMENTARIO -->
        <div class="form-group">

          <label>
            Comentario
          </label>

          <ion-textarea
            fill="outline"
            rows="6"
            placeholder="Cuéntanos cómo fue la tutoría y si te ayudó a resolver tu duda..."
          >
          </ion-textarea>

        </div>


        <!-- ACCIONES -->
        <div class="form-actions">

          <ion-button
            class="secondary-button"
            type="button"
            fill="outline"
            routerLink="/evaluaciones"
          >
            Cancelar
          </ion-button>

          <ion-button
            class="primary-button"
            type="button"
          >
            Enviar evaluación
          </ion-button>

        </div>

      </section>

    </main>

  </div>

</ion-content>
