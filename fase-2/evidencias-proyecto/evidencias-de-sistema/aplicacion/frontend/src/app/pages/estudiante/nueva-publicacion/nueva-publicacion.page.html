<ion-content [fullscreen]="true">

  <div class="page-container">

    <header class="page-header">

      <div>
        <ion-button
          class="back-button"
          type="button"
          fill="clear"
          routerLink="/comunidad"
        >
          ← Volver
        </ion-button>

        <div>
          <h1>Nueva publicación</h1>
          <p>Comparte una duda con la comunidad</p>
        </div>
      </div>

      <app-side-menu></app-side-menu>

    </header>


    <main class="page-card">

      <!-- TÍTULO -->
      <div class="form-group">

        <label>
          Título
        </label>

        <ion-input
          type="text"
          fill="outline"
          [(ngModel)]="titulo"
          placeholder="Ej: ¿Cómo puedo recorrer una lista en Java?"
        >
        </ion-input>

      </div>


      <!-- ASIGNATURA -->
      <div class="form-group">

        <label>
          Asignatura
        </label>

        <ion-select
          class="asignatura-select"
          fill="outline"
          interface="popover"
          [interfaceOptions]="{
            cssClass: 'entrepares-select-popover'
          }"
          [(ngModel)]="idAsignatura"
          placeholder="Selecciona una asignatura"
        >
          <ion-select-option [value]="1">
            Programación
          </ion-select-option>

          <ion-select-option [value]="2">
            Bases de Datos
          </ion-select-option>

          <ion-select-option [value]="3">
            Matemáticas
          </ion-select-option>

          <ion-select-option [value]="4">
            Ingeniería de Software
          </ion-select-option>
        </ion-select>

      </div>


      <!-- DESCRIPCIÓN -->
      <div class="form-group">

        <label>
          Describe tu duda
        </label>

        <ion-textarea
          fill="outline"
          rows="7"
          [(ngModel)]="descripcion"
          placeholder="Explica tu duda con el mayor detalle posible..."
        >
        </ion-textarea>

      </div>


      <!-- ACCIONES -->
      <div class="form-actions">

        <ion-button
          class="secondary-button"
          type="button"
          fill="outline"
          routerLink="/comunidad"
        >
          Cancelar
        </ion-button>

        <ion-button
          class="primary-button"
          type="button"
          (click)="publicarConsulta()"
        >
          Publicar consulta
        </ion-button>

      </div>

    </main>

  </div>

</ion-content>
