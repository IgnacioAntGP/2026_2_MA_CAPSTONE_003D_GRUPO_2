<ion-content [fullscreen]="true">

  <div class="login-container">

    <div class="login-wrapper">

      <!-- PRESENTACIÓN -->
      <header class="login-header">

        <span class="login-label">
          EntrePares
        </span>

        <h1>
          Bienvenido
        </h1>

        <p>
          Ingresa a tu comunidad de apoyo académico entre estudiantes.
        </p>

      </header>


      <!-- FORMULARIO -->
      <form
        class="login-form"
        (ngSubmit)="ingresar()"
      >

        <div class="login-form-header">

          <h2>
            Iniciar sesión
          </h2>

          <p>
            Ingresa tus datos para continuar.
          </p>

        </div>


        <!-- CORREO -->
        <div class="form-group">

          <label for="correo">
            Correo
          </label>

          <ion-input
            id="correo"
            name="correo"
            type="email"
            fill="outline"
            [(ngModel)]="correo"
            placeholder="Ingresa tu correo"
            autocomplete="email"
            required
          ></ion-input>

        </div>


        <!-- CONTRASEÑA -->
        <div class="form-group password-group">

          <div class="password-label">

            <label for="password">
              Contraseña
            </label>

            <ion-button
              class="forgot-password"
              type="button"
              fill="clear"
              size="small"
            >
              ¿Olvidaste tu contraseña?
            </ion-button>

          </div>


          <ion-input
            id="password"
            name="password"
            type="password"
            fill="outline"
            [(ngModel)]="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            required
          ></ion-input>

        </div>


        <!-- INGRESAR -->
        <ion-button
          class="login-button"
          type="submit"
          expand="block"
          routerLink="/comunidad"
        >
          Ingresar
        </ion-button>


        <!-- REGISTRO -->
        <div class="register-section">

          <span>
            ¿No tienes una cuenta?
          </span>

          <ion-button
            class="register-button"
            type="button"
            fill="clear"
            size="small"
          >
            Regístrate
          </ion-button>

        </div>

      </form>

    </div>

  </div>

</ion-content>
