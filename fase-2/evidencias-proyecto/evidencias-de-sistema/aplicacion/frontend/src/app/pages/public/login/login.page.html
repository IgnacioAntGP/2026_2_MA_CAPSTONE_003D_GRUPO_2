<ion-content [fullscreen]="true">

  <div class="login-container">

    <div class="login-wrapper">

      <!-- PRESENTACIÓN -->
      <header class="login-header">

        <span class="login-label">
          EntrePares
        </span>

        <h1>
          Bienvenido
        </h1>

        <p>
          Ingresa a tu comunidad de apoyo académico entre estudiantes.
        </p>
      </header>


      <!-- FORMULARIO -->
      <form
        class="login-form"
        (ngSubmit)="ingresar()"
      >

        <div class="login-form-header">

          <h2>
            Iniciar sesión
          </h2>

          <p>
            Ingresa tus datos para continuar.
          </p>

        </div>


        <!-- CORREO -->
        <div class="form-group">

          <label for="correo">
            Correo
          </label>

          <input
            id="correo"
            name="correo"
            type="email"
            [(ngModel)]="correo"
            placeholder="Ingresa tu correo"
            autocomplete="email"
            required
          />

        </div>


        <!-- CONTRASEÑA -->
        <div class="form-group password-group">

          <div class="password-label">

            <label for="password">
              Contraseña
            </label>

            <button
              class="forgot-password"
              type="button"
            >
              ¿Olvidaste tu contraseña?
            </button>

          </div>

          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            required
          />

        </div>


        <!-- INGRESAR -->
        <button
          class="primary-button login-button"
          type="submit"
          routerLink="/comunidad"
          
        >
          Ingresar
        </button>


        <!-- REGISTRO -->
        <div class="register-section">

          <span>
            ¿No tienes una cuenta?
          </span>

          <button
            class="register-button"
            type="button"
          >
            Regístrate
          </button>

        </div>

      </form>

    </div>

  </div>

</ion-content>
