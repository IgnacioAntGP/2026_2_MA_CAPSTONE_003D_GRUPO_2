<!-- BOTÓN DEL MENÚ -->
<ion-button
  class="menu-button"
  type="button"
  fill="outline"
  aria-label="Abrir menú"
  (click)="alternarMenu()"
>
  <ion-icon
    name="menu-outline"
  ></ion-icon>
</ion-button>


<!-- OVERLAY DEL MENÚ -->
<div
  class="menu-overlay"
  *ngIf="menuAbierto"
  (click)="cerrarMenu()"
></div>


<!-- MENÚ LATERAL -->
<aside
  class="side-menu"
  *ngIf="menuAbierto"
>

  <!-- CABECERA -->
  <div class="side-menu-header">

    <div class="side-menu-brand">

      <img
        class="brand-icon"
        src="assets/icon/entrepares-icon.png"
        alt="EntrePares"
      />

      <div class="brand-text">

        <h2>EntrePares</h2>

        <span>
          Tu espacio académico
        </span>

      </div>

    </div>

    <ion-button
      type="button"
      class="close-menu-button"
      fill="clear"
      aria-label="Cerrar menú"
      (click)="cerrarMenu()"
    >
      <ion-icon
        name="close-outline"
      ></ion-icon>
    </ion-button>

  </div>


  <!-- CONTENIDO -->
  <div class="side-menu-content">


    <!-- MI ACTIVIDAD -->
    <div class="menu-section">

      <span class="menu-section-title">
        Mi actividad
      </span>

      <ion-button
        type="button"
        class="menu-item"
        fill="clear"
        expand="block"
        routerLink="/mis-publicaciones"
        (click)="cerrarMenu()"
      >
        <ion-icon
          slot="start"
          name="document-text-outline"
        ></ion-icon>

        Mis publicaciones
      </ion-button>

      <ion-button
        type="button"
        class="menu-item"
        fill="clear"
        expand="block"
        routerLink="/mis-tutorias"
        (click)="cerrarMenu()"
      >
        <ion-icon
          slot="start"
          name="school-outline"
        ></ion-icon>

        Mis tutorías
      </ion-button>

      <ion-button
        type="button"
        class="menu-item"
        fill="clear"
        expand="block"
        routerLink="/evaluaciones"
        (click)="cerrarMenu()"
      >
        <ion-icon
          slot="start"
          name="star-outline"
        ></ion-icon>

        Evaluaciones
      </ion-button>

    </div>


    <!-- MI CUENTA -->
    <div class="menu-section">

      <span class="menu-section-title">
        Mi cuenta
      </span>

      <ion-button
        type="button"
        class="menu-item"
        fill="clear"
        expand="block"
        routerLink="/mi-perfil"
        (click)="cerrarMenu()"
      >
        <ion-icon
          slot="start"
          name="person-outline"
        ></ion-icon>

        Mi perfil
      </ion-button>

      <ion-button
        type="button"
        class="menu-item"
        fill="clear"
        expand="block"
        routerLink="/postular-ayudante"
        (click)="cerrarMenu()"
      >
        <ion-icon
          slot="start"
          name="ribbon-outline"
        ></ion-icon>

        Postula como ayudante
      </ion-button>

    </div>


    <!-- AYUDANTÍAS -->
    <div class="menu-section">

      <span class="menu-section-title">
        Ayudantías
      </span>

      <ion-button
        type="button"
        class="menu-item"
        fill="clear"
        expand="block"
        routerLink="/ayudante"
        (click)="cerrarMenu()"
      >
        <ion-icon
          slot="start"
          name="people-outline"
        ></ion-icon>

        Panel del Ayudante
      </ion-button>

    </div>


    <!-- ADMINISTRACIÓN -->
    <div class="menu-section">

      <span class="menu-section-title">
        Administración
      </span>

      <ion-button
        type="button"
        class="menu-item"
        fill="clear"
        expand="block"
        routerLink="/panel-admin"
        (click)="cerrarMenu()"
      >
        <ion-icon
          slot="start"
          name="settings-outline"
        ></ion-icon>

        Panel del Administrador
      </ion-button>

    </div>

  </div>


  <!-- CERRAR SESIÓN -->
  <div class="menu-section-bottom">

    <ion-button
      type="button"
      class="menu-item logout"
      fill="clear"
      expand="block"
      routerLink="/login"
      (click)="cerrarMenu()"
    >
      <ion-icon
        slot="start"
        name="log-out-outline"
      ></ion-icon>

      Cerrar sesión
    </ion-button>

  </div>

</aside>
