<!-- Botón del menu -->
    <button
      class="menu-button"
      type="button"
      (click)="menuAbierto = !menuAbierto"
    >
      ☰
    </button>

    <!-- OVERLAY DEL MENÚ -->
    <div
      class="menu-overlay"
      *ngIf="menuAbierto"
      (click)="menuAbierto = false"
    ></div>


    <!-- MENÚ LATERAL -->
    <aside
      class="side-menu"
      *ngIf="menuAbierto"
    >

      <div class="side-menu-header">

        <h2>Menú</h2>

        <button
          type="button"
          class="close-menu-button"
          (click)="menuAbierto = false"
        >
          ×
        </button>

      </div>


      <!-- MI ACTIVIDAD -->
      <div class="menu-section">

        <span class="menu-section-title">
          Mi actividad
        </span>

        <button
          type="button"
          class="menu-item"
          routerLink="/mis-publicaciones"
          (click)="menuAbierto = false"
        >
          Mis publicaciones
        </button>

        <button
          type="button"
          class="menu-item"
          routerLink="/mis-tutorias"
          (click)="menuAbierto = false"
        >
          Mis tutorías
        </button>

        <button
          type="button"
          class="menu-item"
          routerLink="/evaluaciones"
          (click)="menuAbierto = false"
        >
          Evaluaciones
        </button>

      </div>


      <!-- MI CUENTA -->
      <div class="menu-section">

        <span class="menu-section-title">
          Mi cuenta
        </span>

        <button
          type="button"
          class="menu-item"
          routerLink="/mi-perfil"
          (click)="menuAbierto = false"
        >
          Mi perfil
        </button>

        <button
          type="button"
          class="menu-item"
          routerLink="/postular-ayudante"
          (click)="menuAbierto = false"
        >
          Postula como ayudante
        </button>

      </div>


      <!-- AYUDANTÍAS -->
      <div class="menu-section">

        <span class="menu-section-title">
          Ayudantías
        </span>

        <button
          type="button"
          class="menu-item"
          routerLink="/ayudante"
          (click)="menuAbierto = false"
        >
          Panel del Ayudante
        </button>

      </div>


      <!-- CERRAR SESIÓN -->
      <div class="menu-section menu-section-bottom">

        <button
          type="button"
          class="menu-item logout"
          routerLink="/login"
          (click)="menuAbierto = false"
        >
          Cerrar sesión
        </button>

      </div>

    </aside>
