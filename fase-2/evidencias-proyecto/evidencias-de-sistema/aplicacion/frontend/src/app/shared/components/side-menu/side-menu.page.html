<!-- BOTÓN DEL MENÚ -->
<ion-button
  class="menu-button"
  type="button"
  fill="outline"
  aria-label="Abrir menú"
  (click)="alternarMenu()"
>
  ☰
</ion-button>


<!-- OVERLAY DEL MENÚ -->
<div
  class="menu-overlay"
  *ngIf="menuAbierto"
  (click)="cerrarMenu()"
></div>


<!-- MENÚ LATERAL -->
<aside
  class="side-menu"
  *ngIf="menuAbierto"
>

  <div class="side-menu-header">

    <h2>Menú</h2>

    <ion-button
      type="button"
      class="close-menu-button"
      fill="clear"
      aria-label="Cerrar menú"
      (click)="cerrarMenu()"
    >
      ×
    </ion-button>

  </div>


  <!-- MI ACTIVIDAD -->
  <div class="menu-section">

    <span class="menu-section-title">
      Mi actividad
    </span>

    <ion-button
      type="button"
      class="menu-item"
      fill="clear"
      expand="block"
      routerLink="/mis-publicaciones"
      (click)="cerrarMenu()"
    >
      Mis publicaciones
    </ion-button>

    <ion-button
      type="button"
      class="menu-item"
      fill="clear"
      expand="block"
      routerLink="/mis-tutorias"
      (click)="cerrarMenu()"
    >
      Mis tutorías
    </ion-button>

    <ion-button
      type="button"
      class="menu-item"
      fill="clear"
      expand="block"
      routerLink="/evaluaciones"
      (click)="cerrarMenu()"
    >
      Evaluaciones
    </ion-button>

  </div>


  <!-- MI CUENTA -->
  <div class="menu-section">

    <span class="menu-section-title">
      Mi cuenta
    </span>

    <ion-button
      type="button"
      class="menu-item"
      fill="clear"
      expand="block"
      routerLink="/mi-perfil"
      (click)="cerrarMenu()"
    >
      Mi perfil
    </ion-button>

    <ion-button
      type="button"
      class="menu-item"
      fill="clear"
      expand="block"
      routerLink="/postular-ayudante"
      (click)="cerrarMenu()"
    >
      Postula como ayudante
    </ion-button>

  </div>


  <!-- AYUDANTÍAS -->
  <div class="menu-section">

    <span class="menu-section-title">
      Ayudantías
    </span>

    <ion-button
      type="button"
      class="menu-item"
      fill="clear"
      expand="block"
      routerLink="/ayudante"
      (click)="cerrarMenu()"
    >
      Panel del Ayudante
    </ion-button>

  </div>


  <!-- ADMINISTRACIÓN -->
  <div class="menu-section">

    <span class="menu-section-title">
      Administración
    </span>

    <ion-button
      type="button"
      class="menu-item"
      fill="clear"
      expand="block"
      routerLink="/panel-admin"
      (click)="cerrarMenu()"
    >
      Panel del Administrador
    </ion-button>

  </div>


  <!-- CERRAR SESIÓN -->
  <div class="menu-section menu-section-bottom">

    <ion-button
      type="button"
      class="menu-item logout"
      fill="clear"
      expand="block"
      routerLink="/login"
      (click)="cerrarMenu()"
    >
      Cerrar sesión
    </ion-button>

  </div>

</aside>
