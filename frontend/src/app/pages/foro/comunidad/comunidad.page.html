<ion-content [fullscreen]="true">

  <div class="page-container">

    <!-- ENCABEZADO -->
    <header class="comunidad-header page-large">

      <div>
        <h1>Comunidad</h1>
        <p>Preguntas y respuestas entre estudiantes</p>
      </div>

      <app-side-menu></app-side-menu>

    </header>

    <!-- BÚSQUEDA Y NUEVA PUBLICACIÓN -->
    <div class="comunidad-actions page-large">

      <input
        class="searchbar"
        type="text"
        placeholder="Buscar una consulta..."
      />

      <button
        class="primary-button new-post-button"
        type="button"
        routerLink="/nueva-publicacion"
      >
        + Nueva publicación
      </button>

    </div>


    <!-- FILTROS -->
    <div class="filters page-large">

      <button
        class="filter active"
        type="button"
      >
        Recientes
      </button>

      <button
        class="filter"
        type="button"
      >
        Sin respuesta
      </button>

      <button
        class="filter"
        type="button"
      >
        Mis publicaciones
      </button>

    </div>


    <!-- CONSULTAS -->
    <main class="consultas page-large">

      <article
        class="consulta-card"
        *ngFor="let consulta of consultas"
        [routerLink]="['/detalle-consulta', consulta.id_consulta]"
      >

        <div class="consulta-header">

          <span class="asignatura">
            {{ consulta.asignatura }}
          </span>

          <span class="fecha">
            {{ consulta.fecha_creacion | date:'dd/MM/yyyy - HH:mm' }}
          </span>

        </div>

        <h2>
          {{ consulta.titulo }}
        </h2>

        <p>
          {{ consulta.descripcion }}
        </p>

        <div class="consulta-footer">

          <span *ngIf="(consulta.total_respuestas ?? 0) === 0">
            Sin respuestas
          </span>

          <span *ngIf="(consulta.total_respuestas ?? 0) === 1">
            1 respuesta
          </span>

          <span *ngIf="(consulta.total_respuestas ?? 0) > 1">
            {{ consulta.total_respuestas }} respuestas
          </span>

          <span>
            Por: {{ consulta.autor }}
          </span>

        </div>

      </article>

    </main>

  </div>

</ion-content>
