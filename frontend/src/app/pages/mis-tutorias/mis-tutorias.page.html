<ion-content [fullscreen]="true">

  <div class="mis-tutorias-container">

    <header class="mis-tutorias-header">

      <button
        class="back-button"
        type="button"
        routerLink="/comunidad"
      >
        ← Volver a Comunidad
      </button>

      <h1>Mis tutorías</h1>

      <p>
        Revisa el estado de tus solicitudes de tutoría.
      </p>

    </header>

    <main class="mis-tutorias-content">

      <article class="tutoria-card">

        <div class="tutoria-card-header">

          <span class="asignatura">
            Programación
          </span>

          <span class="estado pendiente">
            Pendiente
          </span>

        </div>

        <h2>
          ¿Cómo puedo recorrer una lista en Java?
        </h2>

        <p class="descripcion">
          Solicitud asociada a tu consulta publicada en la comunidad.
        </p>

        <div class="tutoria-info">

          <div>
            <span class="info-label">Modalidad</span>
            <span class="info-value">Online</span>
          </div>

          <div>
            <span class="info-label">Solicitud</span>
            <span class="info-value">Enviada recientemente</span>
          </div>

        </div>

      </article>

    </main>

  </div>

</ion-content>
