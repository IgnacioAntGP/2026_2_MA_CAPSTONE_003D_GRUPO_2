<ion-content [fullscreen]="true">

  <div class="perfil-container">

    <header class="perfil-header">

      <button
        class="back-button"
        type="button"
        routerLink="/comunidad"
      >
        ← Volver a Comunidad
      </button>

      <h1>Mi perfil</h1>

      <p>
        Información de tu cuenta en EntrePares.
      </p>

    </header>

    <main class="perfil-content">

      <section class="perfil-card">

        <div class="perfil-avatar">
          M
        </div>

        <div class="perfil-identidad">

          <h2>Matías González</h2>

          <span class="rol">
            Estudiante
          </span>

        </div>

      </section>

      <section class="datos-card">

        <h2>Datos personales</h2>

        <div class="dato">

          <span class="dato-label">
            Nombre
          </span>

          <span class="dato-value">
            Matías González
          </span>

        </div>

        <div class="dato">

          <span class="dato-label">
            Correo
          </span>

          <span class="dato-value">
            matias.gonzalez@entrepares.cl
          </span>

        </div>

        <div class="dato">

          <span class="dato-label">
            Carrera
          </span>

          <span class="dato-value">
            Ingeniería en Informática
          </span>

        </div>

        <div class="dato">

          <span class="dato-label">
            Nivel
          </span>

          <span class="dato-value">
            2° año
          </span>

        </div>
        <div class="perfil-actions">

          <button
            type="button"
            class="edit-profile-button"
            routerLink="/editar-perfil"
          >
            Editar perfil
          </button>

        </div>

      </section>

      <section class="actividad-card">

        <h2>Mi actividad</h2>

        <div class="actividad-grid">

          <div class="actividad-item">

            <strong>2</strong>

            <span>
              Publicaciones
            </span>

          </div>

          <div class="actividad-item">

            <strong>5</strong>

            <span>
              Respuestas
            </span>

          </div>

          <div class="actividad-item">

            <strong>1</strong>

            <span>
              Tutoría solicitada
            </span>

          </div>

        </div>

      </section>

    </main>

  </div>

</ion-content>
