<ion-content [fullscreen]="true">

  <div class="page-container">

    <header class="page-header">

      <button
        class="back-button"
        type="button"
        routerLink="/mi-perfil"
      >
        ← Volver a Mi perfil
      </button>

      <h1>Editar perfil</h1>

      <p>
        Actualiza la información académica de tu perfil.
      </p>

    </header>

    <main
      class="page-card"
      *ngIf="perfil"
    >

      <!-- NOMBRE -->
      <div class="form-group">

        <label for="nombre">
          Nombre
        </label>

        <input
          id="nombre"
          type="text"
          [value]="perfil.nombre + ' ' + perfil.apellido"
          disabled
        />

      </div>


      <!-- RUT -->
      <div class="form-group">

        <label for="rut">
          RUT
        </label>

        <input
          id="rut"
          type="text"
          [value]="perfil.rut"
          disabled
        />

      </div>


      <!-- CORREO -->
      <div class="form-group">

        <label for="correo">
          Correo
        </label>

        <input
          id="correo"
          type="email"
          [value]="perfil.correo"
          disabled
        />

      </div>


      <!-- CARRERA -->
      <div class="form-group">

        <label for="carrera">
          Carrera
        </label>

        <input
          id="carrera"
          type="text"
          [(ngModel)]="carrera"
        />

      </div>


      <!-- SEMESTRE -->
      <div class="form-group">

        <label for="semestre">
          Semestre
        </label>

        <select
          id="semestre"
          [(ngModel)]="semestre"
        >

          <option [ngValue]="1">
            1° semestre
          </option>

          <option [ngValue]="2">
            2° semestre
          </option>

          <option [ngValue]="3">
            3° semestre
          </option>

          <option [ngValue]="4">
            4° semestre
          </option>

          <option [ngValue]="5">
            5° semestre
          </option>

          <option [ngValue]="6">
            6° semestre
          </option>

          <option [ngValue]="7">
            7° semestre
          </option>

          <option [ngValue]="8">
            8° semestre
          </option>

        </select>

      </div>


      <!-- INSTITUCIÓN -->
      <div class="form-group">

        <label for="institucion">
          Institución
        </label>

        <input
          id="institucion"
          type="text"
          [(ngModel)]="institucion"
        />

      </div>


      <!-- ACCIONES -->
      <div class="form-actions">

        <button
          class="secondary-button"
          type="button"
          routerLink="/mi-perfil"
        >
          Cancelar
        </button>

        <button
          class="primary-button"
          type="button"
          (click)="guardarCambios()"
        >
          Guardar cambios
        </button>

      </div>

    </main>

  </div>

</ion-content>
