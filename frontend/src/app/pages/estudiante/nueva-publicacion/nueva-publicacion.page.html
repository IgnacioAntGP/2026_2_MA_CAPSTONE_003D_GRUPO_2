<ion-content [fullscreen]="true">

  <div class="publicacion-container">

    <header class="publicacion-header">

      <button
        class="back-button"
        type="button"
        routerLink="/comunidad"
      >
        ← Volver
      </button>

      <div>
        <h1>Nueva publicación</h1>
        <p>Comparte una duda con la comunidad</p>
      </div>

    </header>


    <main class="publicacion-form">

      <!-- TÍTULO -->
      <div class="form-group">

        <label for="titulo">
          Título
        </label>

        <input
          id="titulo"
          type="text"
          [(ngModel)]="titulo"
          placeholder="Ej: ¿Cómo puedo recorrer una lista en Java?"
        />

      </div>


      <!-- ASIGNATURA -->
      <div class="form-group">

        <label for="asignatura">
          Asignatura
        </label>

        <select
          id="asignatura"
          [(ngModel)]="idAsignatura"
        >

          <option
            [ngValue]="null"
            disabled
          >
            Selecciona una asignatura
          </option>

          <option [ngValue]="1">
            Programación
          </option>

          <option [ngValue]="2">
            Bases de Datos
          </option>

          <option [ngValue]="3">
            Matemáticas
          </option>

          <option [ngValue]="4">
            Ingeniería de Software
          </option>

        </select>

      </div>


      <!-- DESCRIPCIÓN -->
      <div class="form-group">

        <label for="descripcion">
          Describe tu duda
        </label>

        <textarea
          id="descripcion"
          rows="7"
          [(ngModel)]="descripcion"
          placeholder="Explica tu duda con el mayor detalle posible..."
        ></textarea>

      </div>


      <!-- ACCIONES -->
      <div class="form-actions">

        <button
          class="cancel-button"
          type="button"
          routerLink="/comunidad"
        >
          Cancelar
        </button>

        <button
          class="publish-button"
          type="button"
          (click)="publicarConsulta()"
        >
          Publicar consulta
        </button>

      </div>

    </main>

  </div>

</ion-content>
