<ion-content [fullscreen]="true">

  <div class="page-container">

    <header class="page-header">

      <button
        class="back-button"
        type="button"
        [routerLink]="['/detalle-consulta', idConsulta]"
      >
        ← Volver a la consulta
      </button>

      <h1>Editar publicación</h1>

      <p>
        Modifica el contenido de tu consulta.
      </p>

    </header>

    <main
      class="page-card"
      *ngIf="consulta"
    >

      <div class="form-group">

        <label for="titulo">
          Título
        </label>

        <input
          id="titulo"
          type="text"
          [(ngModel)]="titulo"
        />

      </div>

      <div class="form-group">

        <label for="asignatura">
          Asignatura
        </label>

        <select
          id="asignatura"
          [(ngModel)]="idAsignatura"
        >

          <option [ngValue]="1">
            Programación
          </option>

          <option [ngValue]="2">
            Bases de Datos
          </option>

          <option [ngValue]="3">
            Matemáticas
          </option>

          <option [ngValue]="4">
            Ingeniería de Software
          </option>

        </select>

      </div>

      <div class="form-group">

        <label for="descripcion">
          Describe tu duda
        </label>

        <textarea
          id="descripcion"
          rows="7"
          [(ngModel)]="descripcion"
        ></textarea>

      </div>

      <div class="form-actions">

        <button
          class="secondary-button"
          type="button"
          [routerLink]="['/detalle-consulta', idConsulta]"
        >
          Cancelar
        </button>

        <button
          class="primary-button"
          type="button"
          (click)="guardarCambios()"
        >
          Guardar cambios
        </button>

      </div>

    </main>

  </div>

</ion-content>
