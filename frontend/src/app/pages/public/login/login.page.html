<ion-content [fullscreen]="true">

  <div class="login-container">

    <div class="login-header">
      <h1>EntrePares</h1>
      <p>Comunidad de apoyo académico entre estudiantes</p>
    </div>

    <form class="login-form" (ngSubmit)="ingresar()">

      <div class="form-group">
        <label for="correo">Correo</label>
        <input
          id="correo"
          name="correo"
          type="email"
          [(ngModel)]="correo"
          placeholder="Ingresa tu correo"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Ingresa tu contraseña"
          required
        />
      </div>

      <button type="submit"
        routerLink="/comunidad"
      >
        
        Ingresar
      </button>

    </form>

  </div>

</ion-content>
